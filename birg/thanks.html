<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Thanks</title>
<style>
  body{margin:0;background:#fff;font-family:'DM Sans',Arial,sans-serif;color:#435249;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center}
  p{font-size:20px;font-weight:700}
</style>
</head>
<body>
<p>You're in &#10003;</p>
<script>
  // The CRM form redirects here after a house sign-up.
  // Send them straight back to the listing with screen 2 open.
  // Only the CRM contact ID goes back (no phone number in the website's address bar).
  (function () {
    var q = new URLSearchParams(location.search);
    var cid = q.get("cid") || "";
    var id = q.get("listing_id") || "";
    if (cid.indexOf("{{") >= 0) cid = "";
    try { if (window.top !== window) parent.postMessage({ qf: "thanks", cid: cid }, "*"); } catch (e) {}
    var back = id ? "https://bowenislandrealestate.com/?p=" + encodeURIComponent(id) : document.referrer || "https://bowenislandrealestate.com/";
    back += (back.indexOf("?") >= 0 ? "&" : "?") + "qf=done" + (cid ? "&qf_cid=" + encodeURIComponent(cid) : "");
    try { window.top.location.replace(back); } catch (e) { location.replace(back); }
  })();
</script>
</body>
</html>
